# Fly.io configuration for owlcms-tracker
# Documentation: https://fly.io/docs/reference/configuration/

app = "fhq-tracker"

# Primary region (change to your preferred region code)
# Region codes: https://fly.io/docs/reference/regions/
# Examples: yyz (Toronto), sea (Seattle), iad (Washington DC), lhr (London)
primary_region = "yyz"

# Backup regions for redundancy (optional)
# regions = ["yyz", "sea"]

[build]
  # Use the Dockerfile in the project root
  dockerfile = "Dockerfile"

  # Bundle ONLY the listed plugin folders for this deployment. The Dockerfile
  # removes every other plugin before `npm run build`. Paths are relative to
  # src/plugins. Official releases never pass this arg, so they keep all plugins.
  [build.args]
    KEEP_PLUGINS = "scoreboards/start-order,scoreboards/lifting-order"

# Environment variables
[env]
  # Enable learning mode to capture OWLCMS messages for debugging
  LEARNING_MODE = "false"
  
  # Node.js environment
  NODE_ENV = "production"
  
  # Logging level: debug, info, warn, error
  LOG_LEVEL = "info"

  # V8 heap limit — set to ~75% of machine RAM to prevent OOM kills
  NODE_OPTIONS = "--max-old-space-size=1536"

# Single HTTP service on standard ports (Fly edge: 80 -> https redirect, 443 TLS).
# Everything is forwarded to the app on internal port 8096:
#   Browsers: https://fhq-tracker.fly.dev          -> 8096
#   OWLCMS:   wss://fhq-tracker.fly.dev/ws          -> 8096 (HTTP upgrade)
#
# IMPORTANT: This app MUST run as a SINGLE machine. The competition hub keeps
# all state in memory: OWLCMS holds one long-lived WebSocket on one machine,
# and browser SSE/API requests must hit that same machine. A second machine
# would serve an empty hub. Keep machine count at 1:
#   - `fly scale count 1` to enforce it
#   - deploy fresh apps with `fly deploy --ha=false` (Fly only auto-adds an HA
#     machine when launching into an empty machine group)
[http_service]
  internal_port = 8096
  force_https = true
  processes = ["app"]

  # Keep the single machine running: OWLCMS holds a long-lived WebSocket and
  # auto-stop causes "instance refused connection" (PC01) errors.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

# Machine resource configuration
# Minimum 1GB memory required for Node.js runtime
[vm]
  memory = "2gb"
  cpus = 1

# Mounts for persistent data (if needed)
# [[mounts]]
#   source = "tracker_data"
#   destination = "/app/local"

# Same entrypoint as local production: attaches the /ws WebSocket handler.
# (node build/index.js alone would serve HTTP but never accept OWLCMS WebSockets.)
[processes]
  app = "node start-with-ws.js"

# Health check configuration
# The Dockerfile includes a HEALTHCHECK instruction
# Fly.io will use that to determine app health
